version: "3"

# Shared AGENTS.md line check. The tag and the checksum move by hand together.
# CI and a run without a terminal need --trusted-hosts github.com for the remote include.
# The shared task reads MODE from here, so a local run and CI both fail on a long file.
vars:
  MODE: fail

includes:
  shared:
    taskfile: https://github.com/ostendorf-cloud/workflows.git//taskfiles/agents-md.yaml?ref=v0.9.0
    checksum: 9309c557cf02835bfef5932ad1c07e3d63325b0d4fa523df5b53befbc9834410
    flatten: true

tasks:
  setup:
    desc: Install the pinned toolchain
    cmds:
      - mise trust
      - mise install

  lint:ruff:
    desc: Python lint
    cmds:
      - ruff check hooks scripts

  lint:ruff-format:
    desc: Python format check
    cmds:
      - ruff format --check hooks scripts

  lint:license:
    desc: License header check for every Python and shell source file
    cmds:
      - |
        addlicense -check -c "Simon Ostendorf" -y 2026 -l apache -s=only \
          $(find . \( -name "*.py" -o -name "*.sh" \) \
            -not -path "./.worktrees/*" -not -path "./.claude/*")

  lint:markdown:
    desc: Markdown lint
    cmds:
      - markdownlint-cli2 "**/*.md"

  lint:yaml:
    desc: YAML lint
    cmds:
      - yamllint .

  lint:actions:
    desc: GitHub Actions workflow lint
    cmds:
      - actionlint

  lint:secrets:
    desc: Secret scan over the git history
    cmds:
      - gitleaks git --no-banner --redact

  lint:renovate:
    desc: Renovate config schema check and preset resolution, no credentials
    cmds:
      - |
        out="$(renovate-config-validator 2>&1)"; code=$?
        printf '%s\n' "$out"
        if printf '%s\n' "$out" | grep -qF "No files to perform configuration validation against"; then
          echo "no Renovate configuration file was found" >&2
          exit 1
        fi
        [ "$code" -eq 0 ] || exit "$code"
      - renovate --platform=local --config-validation-error

  test:hooks:
    desc: Hook tests
    cmds:
      - python3 -m unittest discover -s hooks/tests -p "test_*.py"

  test:scripts:
    desc: Installer and validator tests
    cmds:
      - python3 -m unittest discover -s scripts/tests -p "test_*.py"

  validate:
    desc: Check skills, manifest, settings and rules in this checkout
    cmds:
      - python3 scripts/validate.py

  check:
    desc: Every check, one after another
    cmds:
      - task: lint:ruff
      - task: lint:ruff-format
      - task: lint:license
      - task: lint:markdown
      - task: lint:yaml
      - task: lint:actions
      - task: lint:secrets
      - task: lint:renovate
      - task: lint:agents-md
      - task: test:hooks
      - task: test:scripts
      - task: validate

  fmt:
    desc: Format Python
    cmds:
      - ruff format hooks scripts
      - ruff check --fix hooks scripts

  install:
    desc: Install this checkout for Claude Code on this machine
    cmds:
      - python3 scripts/install.py install

  uninstall:
    desc: Remove the installed files and restore the backups
    cmds:
      - python3 scripts/install.py uninstall

  status:
    desc: Show what is installed and whether it drifts from this checkout
    cmds:
      - python3 scripts/install.py status

  doctor:
    desc: Check tools, links, settings and hooks of the installation
    cmds:
      - python3 scripts/install.py doctor
