[tools]
python = "3.15.2"
task = "3"
ruff = "0.17.5"
actionlint = "1"
markdownlint-cli2 = "0.24.1"
yamllint = "1"
gitleaks = "8"
jq = "1"
"aqua:google/addlicense" = "1.2.0"
# Renovate 44 needs Node ^24.11 or ^26.13.
node = "24.11.0"

[tools."npm:renovate"]
version = "44.244.2"
# One transitive dependency lacks a provenance attestation at this version.
trust_policy_excludes = ["@yarnpkg/libzip@3.2.2"]
