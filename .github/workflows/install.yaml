name: install

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: install into a throwaway home
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          python3 scripts/install.py install --profile ci
          python3 scripts/install.py doctor --profile ci
