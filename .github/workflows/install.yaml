name: install

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-profile:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db  # v3.6.3
      - name: install into a throwaway home
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          python3 scripts/install.py install --profile ci
          python3 scripts/install.py doctor --profile ci
