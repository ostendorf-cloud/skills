name: install

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci-profile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: jdx/mise-action@90f833d396d0cc3674b631d2d225e306476c303a  # v5.2.10
      - name: install into a throwaway home
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          python3 scripts/install.py install --profile ci
          python3 scripts/install.py doctor --profile ci
