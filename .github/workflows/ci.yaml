name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v3
      - run: task lint
      - run: task test
      - run: task validate

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: jdx/mise-action@v3
      - name: install into a throwaway home
        env:
          HOME: ${{ runner.temp }}/home
        run: |
          mkdir -p "$HOME"
          python3 scripts/install.py install --profile ci
          python3 scripts/install.py doctor --profile ci
