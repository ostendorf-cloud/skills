name: codeql

# Thin caller: the analysis itself lives in the shared workflows repository, so
# the matrix, the action pins and the build modes are maintained in one place.
#
# Two languages. "python" covers hooks/ and scripts/, the only compiled-or-
# interpreted source this repository ships. "actions" covers this repository's
# own workflow YAML, which mints a GitHub App token, checks out a ref derived
# from the event payload and passes event data into run: blocks, the shapes
# CodeQL's Actions queries look for.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly disclosed vulnerability pattern is caught in code that
    # has not changed.
    - cron: "17 5 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    uses: ostendorf-cloud/workflows/.github/workflows/reusable-codeql.yaml@v0.1.0
    with:
      languages: '["python", "actions"]'
      runs-on-runner: blacksmith-2vcpu-ubuntu-2404
