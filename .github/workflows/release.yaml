name: release

on:
  push:
    branches: [main]
  pull_request:
    types: [labeled, unlabeled]

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    # The label list is release-me.yaml's labels, spelled out: the condition cannot read the
    # configuration. alpha, beta and rc are disabled (empty label) and left out.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release-me/') &&
      contains(
        fromJSON('["autorelease: pending", "autorelease: tagged"]'),
        github.event.label.name
      ))
    steps:
      - name: mint the release app token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349  # v2.2.2
        with:
          app-id: ${{ vars.GH_APP_RELEASE_APP_ID }}
          private-key: ${{ secrets.GH_APP_RELEASE_PRIVATE_KEY }}

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # A label event checks out the base branch, never the merge ref.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      - uses: ostendorf-cloud/release-me/action@1dbb9d456ee6017b078e573e63db8a01e78e0c96  # v0.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          app-slug: ${{ steps.app-token.outputs.app-slug }}
